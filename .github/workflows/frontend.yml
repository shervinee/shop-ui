name: Shop UI

on:
  workflow_dispatch:

  pull_request:

  push:
    branches:
      - main
      - develop
      - hotfix-*

concurrency:
  group: shop-ui/${{ github.workflow }}@{{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build_test_lint:
    runs-on: ubuntu-latest
    env:
      CI: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: List files for sanity
        run: |
          pwd
          ls -la
          ls -la shop-ui || true
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Prettier Check
        run: npm run format:check --if-present
      - name: Unit Tests (optional)
        run: npm test --if-present -- --watch=false
      - name: Build
        run: npm run build
      - name: Upload dist artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: dist
