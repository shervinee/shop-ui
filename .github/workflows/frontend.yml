name: Shop UI

on:
  workflow_dispatch:

  pull_request:
    paths:
      - "shop-ui/**"
  push:
    branches:
      - main
      - develop
      - hotfix-*

jobs:
  build_test_lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shop-ui
    env:
      CI: "true"

      steps:
        - name: Checkout
          uses: actions/checkout@v4
        - name: Setup Node
          uses: actions/setup-node@v4
          with:
            node-version: "22.x"
            cache: npm
            cache-dependency-path: shop-ui/package-lock.json
        - name: Install dependencies
          run: npm ci
        - name: Lint
          run: npm run lint
        - name: Prettier Check
          run: npm run format:check
        - name: Unit Tests (optional)
          run: npm test --if-present -- --watch=false
