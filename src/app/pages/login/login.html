    <h1 id="login-title" class="m-0">Sign in</h1>

    <!-- Temporary neutral form (no Angular forms, no auth) -->
    <div class="grid mt-3">
      <label class="field" for="username">
        <span class="label">Username</span>
        <input
          id="username"
          class="input"
          type="text"
          autocomplete="username"
        />
      </label>
      <label class="field" for="password">
        <span class="label">Password</span>
        <input
          id="password"
          class="password"
          type="password"
          autocomplete="current-password"
        />
      </label>
      <button class="btn primary" type="button" (click)="submitFallback()">
        {{ submitting ? "Signing in…" : "Sign in" }}
      </button>
    </div>
  </div>
